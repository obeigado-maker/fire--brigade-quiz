                },
                answer: "B",
                explanation: "解析：《消防局組織及運作》第三十八條在本行政法規中明確規定每年五月二日為「消防局日」。"
            },
            {
                type: "fill",
                text: "每年的______為「消防局日」，是紀念消防局職能與貢獻的專門日期。",
                answer: "5月2日",
                explanation: "解析：依據《消防局組織及運作》第三十八條，「消防局日」的具體日期為每年五月二日。"
            }
        ];

        // 全域變數
        let currentQuestionIndex = 0;
        let selectedOption = null;

        // DOM元素
        const questionCountEl = document.getElementById("questionCount");
        const questionTypeEl = document.getElementById("questionType");
        const questionTextEl = document.getElementById("questionText");
        const optionsAreaEl = document.getElementById("optionsArea");
        const fillAreaEl = document.getElementById("fillArea");
        const fillAnswerEl = document.getElementById("fillAnswer");
        const resultEl = document.getElementById("result");
        const explanationEl = document.getElementById("explanation");
        const submitBtnEl = document.getElementById("submitBtn");
        const nextBtnEl = document.getElementById("nextBtn");

        // 初始化當前題目
        function initCurrentQuestion() {
            // 重置狀態
            selectedOption = null;
            resultEl.className = "result";
            explanationEl.className = "explanation";
            fillAnswerEl.className = "fill-input";
            fillAnswerEl.value = "";
            // 清空選項
            optionsAreaEl.innerHTML = "";

            // 取得當前題目
            const currentQ = questionBank[currentQuestionIndex];
            
            // 更新題目計數
            questionCountEl.textContent = `題目：${currentQuestionIndex + 1}/${questionBank.length}`;
            
            // 更新題型和題幹
            questionTypeEl.textContent = currentQ.type === "single" ? "單選題" : "填空題";
            questionTextEl.textContent = currentQ.text;

            // 顯示對應題型區域
            if (currentQ.type === "single") {
                optionsAreaEl.style.display = "flex";
                fillAreaEl.style.display = "none";
                // 生成選項
                for (const [key, value] of Object.entries(currentQ.options)) {
                    const optionEl = document.createElement("div");
                    optionEl.className = "option";
                    optionEl.dataset.answer = key;
                    optionEl.textContent = `${key}. ${value}`;
                    optionEl.addEventListener("click", () => {
                        // 取消其他選項選中狀態
                        document.querySelectorAll(".option").forEach(el => {
                            el.style.borderColor = "#ddd";
                        });
                        // 選中當前選項
                        optionEl.style.borderColor = "#007bff";
                        selectedOption = key;
                    });
                    optionsAreaEl.appendChild(optionEl);
                }
            } else {
                optionsAreaEl.style.display = "none";
                fillAreaEl.style.display = "block";
            }

            // 更新解析
            explanationEl.textContent = currentQ.explanation;
        }

        // 提交答案
        function submitAnswer() {
            const currentQ = questionBank[currentQuestionIndex];
            let isCorrect = false;

            if (currentQ.type === "single") {
                // 單選題驗證
                if (!selectedOption) {
                    alert("請選擇一個選項！");
                    return;
                }
                isCorrect = selectedOption === currentQ.answer;
                // 標記正確/錯誤選項
                document.querySelectorAll(".option").forEach(el => {
                    if (el.dataset.answer === currentQ.answer) {
                        el.className = "option correct";
                    } else if (el.dataset.answer === selectedOption && !isCorrect) {
                        el.className = "option wrong";
                    }
                });
            } else {
                // 填空題驗證（忽略大小寫/空格）
                const userAnswer = fillAnswerEl.value.trim().toLowerCase();
                const correctAnswer = currentQ.answer.trim().toLowerCase();
                isCorrect = userAnswer === correctAnswer;
                // 標記輸入框
                fillAnswerEl.className = `fill-input ${isCorrect ? "correct" : "wrong"}`;
            }

            // 顯示結果
            resultEl.className = `result ${isCorrect ? "correct" : "wrong"}`;
            resultEl.textContent = isCorrect ? "✅ 回答正確！" : `❌ 回答錯誤，正確答案是：${currentQ.answer}`;
            // 顯示解析
            explanationEl.className = "explanation show";
        }

        // 下一題
        function nextQuestion() {
            if (currentQuestionIndex === questionBank.length - 1) {
                alert("🎉 已完成所有題目！");
                currentQuestionIndex = 0; // 重置為第一題
            } else {
                currentQuestionIndex++;
            }
            initCurrentQuestion();
        }

        // 綁定事件
        submitBtnEl.addEventListener("click", submitAnswer);
        nextBtnEl.addEventListener("click", nextQuestion);

        // 初始化
        initCurrentQuestion();
    </script>
</body>
</html>
